services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: tennis_edge
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
    ports:
      - "5432:5432"
    volumes:
      - tennis_edge_pg:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  tennis_edge_pg:
